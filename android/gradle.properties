# 内存参数：本机 Windows 页文件偏小，G1 GC 启动需预留大块虚拟空间(并发标记溢出栈)导致 mmap/errno=1455 失败。
# 改用品行 ParallelGC（虚拟预留远小于 G1），绕开该限制；-Xmx1024M 为分架构打包(splits)调低后的值（1536M 在全架构包可成，但分架构并发峰值更高会 OOM kill）。
org.gradle.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=320m -XX:ReservedCodeCacheSize=192m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
# 本机内存紧张（WorkBuddy 多实例常驻）：禁用常驻 daemon + 限制并发 worker，降低峰值内存
org.gradle.daemon=false
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.incremental=false
# Kotlin 守护进程单独限内存，避免与 Gradle JVM 叠加冲高；同样用 ParallelGC 绕开 G1 虚拟预留限制
kotlin.daemon.jvmargs=-Xmx512M -XX:MaxMetaspaceSize=192m -XX:+UseParallelGC
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
