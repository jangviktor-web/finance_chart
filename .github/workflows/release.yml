name: Release APK

# 触发（三选一命中即跑）：
#   1. 推送以 v 开头的 tag（如 v1.11.3）→ 构建 4 个包 **并发 Release**
#   2. 推送到 master → 构建 4 个包，**只留 workflow artifact，不发 Release**
#      （见「Publish」步骤的 tag 守卫），便于每次提交都先验证 CI 能出包
#   3. Actions 页面手动触发（workflow_dispatch）→ 同 2，只构建不发 Release
#
# 产物：1 个通用包（app-release.apk）+ 3 个分架构包
#       （arm64-v8a / armeabi-v7a / x86_64），共 4 个 APK。
#
# Release 正文：body_path 指向 release_notes/<tag>.md（如 release_notes/v1.11.3.md）。
#   ⛔ 该文件缺失**不会**让发布失败 —— action 内部 try/catch 只 warn 就继续，
#      会静默发出一个**正文为空**的 Release（job 依然是绿的）。这比直接失败更危险。
#      故下面加了「Verify release note exists」步骤主动拦住它。
#
# 签名：必须配置仓库 Secrets（SIGNING_KEY / KEY_STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD）。
#   ⛔ 刻意不做「缺 Secret 就回退 debug 签名」的兜底：那会静默产出 debug 签名的包，
#      下载安装会报「应用未安装 / 签名冲突」，排查成本远高于直接构建失败。
#      生成 SIGNING_KEY 示例：base64 -w0 your.keystore.jks

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 预拉取 NDK 等 Android 构件（Flutter 管理的下载，确保 NDK 版本匹配 flutter.ndkVersion）
      - name: Precache Android artifacts
        run: flutter precache --android

      # ⚠️ 不再使用 android-actions/setup-android：该 action 会尝试安装已被
      # Google 下线的 "tools" 包（sdkmanager "tools"），命中
      # "Failed to find package 'tools'" → CI 永远失败。
      # （升到 @v4 无效：v4 的 packages 默认值同样是 'tools platform-tools'。）
      # 改为直接用 Flutter 自带的 cmdline-tools/sdkmanager 安装所需构件。
      - name: Accept licenses & install Android SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # 从 Secrets 还原 keystore 与签名配置（key.properties 已被 .gitignore 忽略）
      - name: Decode keystore & write key.properties
        run: |
          echo "$SIGNING_KEY" | base64 -d > android/app/release-key.jks
          echo "storeFile=release-key.jks" > android/key.properties
          echo "storePassword=$KEY_STORE_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "storeType=PKCS12" >> android/key.properties
          echo "已写入签名配置（密钥内容不回显）"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # CI 机器内存充裕（~7GB），而本仓库 android/gradle.properties 是为本机
      # 小页文件 OOM 环境调的（1.5GB 堆 + 串行 GC + 单 worker + 关守护进程），
      # 会让 R8 混淆慢 10~30 倍。此处仅覆盖 CI 检出的副本，不影响本地构建。
      - name: Tune Gradle heap for CI
        run: |
          sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError|' android/gradle.properties
          sed -i 's|^org.gradle.daemon=.*|org.gradle.daemon=true|' android/gradle.properties
          echo "--- android/gradle.properties (CI override) ---"
          grep -E "org.gradle.jvmargs|org.gradle.daemon" android/gradle.properties

      # 第一步：不带 --split-per-abi → build.gradle.kts 中 splits.abi.isEnable=false → 仅产通用包
      - name: Build release APK (universal)
        run: flutter build apk --release

      # 第二步：--split-per-abi → 传入 -Psplit-per-abi=true → 产 3 个分架构包
      - name: Build release APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List built APKs
        run: ls -lh build/app/outputs/flutter-apk/*.apk

      # ⛔ 这一步是为了防「假成功」：body_path 指向的文件缺失时，
      # softprops/action-gh-release 只 warn 不报错，会静默发出空正文的 Release。
      - name: Verify release note exists
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTE="release_notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$NOTE" ]; then
            echo "::error::缺少 $NOTE —— 不建 release note 会静默发出空正文的 Release，故此处主动失败"
            exit 1
          fi
          echo "已找到 $NOTE"

      # 手动触发 / 推 master 时 github.ref_name 是分支名（如 master），
      # 不做守卫会建出一个名为 master 的垃圾 Release。故只有 tag 触发才发布。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          # 动态引用与 tag 同名的 release note（release_notes/vX.Y.Z.md）
          body_path: release_notes/${{ github.ref_name }}.md
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/*.apk

      # 推 master / 手动触发时把 4 个包留成 workflow artifact，便于下载核验
      - name: Upload APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ github.ref_name }}
          path: build/app/outputs/flutter-apk/*.apk
